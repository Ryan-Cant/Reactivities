$kind: http-request
url: "{{url}}/api/activities?startDate={{activityDate}}&isGoing=true"
method: GET
queryParams:
  startDate: "{{activityDate}}"
  isGoing: "true"
scripts:
  - type: afterResponse
    code: |-
      var data = pm.response.json();

      // response to be 200
      pm.test("response is 200", function() {
          pm.response.to.have.status(200)
      });
    language: text/javascript
  - type: beforeRequest
    code: "var moment = require(\"moment\");\r

      \r

      pm.environment.set('activityDate', moment().add(-3,
      'months').toISOString());"
    language: text/javascript
order: 8000
