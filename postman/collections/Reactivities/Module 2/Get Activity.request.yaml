$kind: http-request
url: "{{url}}/api/activities/{{activityId}}"
method: GET
scripts:
  - type: prerequest
    code: |-
      var id = pm.collectionVariables.get("activityId");
      if (!id) {
          throw new Error("Run \"Get Activities\" first — it sets activityId from the seeded database.");
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("response is 200", function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 3000
