$kind: http-request
url: "{{url}}/api/activities"
method: GET
scripts:
  - type: afterResponse
    code: |-
      var data = pm.response.json();

      pm.test("response is 200", function() {
          pm.response.to.have.status(200)
      });

      pm.test("has expected activity fields", function() {
          pm.expect(data[0]).to.have.property('id');
          pm.expect(data[0]).to.have.property('title');
          pm.expect(data[0]).to.have.property('description');
          pm.expect(data[0]).to.have.property('date');
          pm.expect(data[0]).to.have.property('city');
          pm.expect(data[0]).to.have.property('venue');
          pm.expect(data[0]).to.have.property('category');
          pm.expect(data[0]).to.have.property('isCancelled');
          pm.expect(data[0]).to.have.property('latitude');
          pm.expect(data[0]).to.have.property('longitude');
      });
      if (Array.isArray(data) && data.length > 0 && data[0].id) {
          pm.collectionVariables.set("activityId", data[0].id);
      }
    language: text/javascript
order: 4000
